<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .quadrado{
            width: 100px;
            height: 100px;
            background-color: black;
            left: 50px;
        }
        .relativo{
            background-color: red;
            width: 100px;
            height: 100px;
            position: relative;
            top: 50px;
            left: 50px;
        }
        .absoluta{
            background-color: blue;
            width: 100px;
            height: 100px;
            left: 20px;
        }
        .fixo{
            background-color: green;
            width: 100px;
            height: 100px;
            left: 10px;
        }
        </style>
    <title>Document</title>
</head>
<body>
    <div class="quadrado">
        <div class="relativo"></div>
        <div class="absoluta"></div>
        <div class="fixo"></div>
</body>
</html>
