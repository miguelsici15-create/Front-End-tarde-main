<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <table border="1">
        <thead><tr><th colspan="3">Tabela de horário de aulas</th></tr>
        <tr>
            <th>Dia</th>
            <th>Manhã</th>
            <th>Tarde</th>
        </tr>
        </thead>
        <tbody>
        <tr><!-- Segunda Linha-->
            <td>Segunda</td><!-- Dia-->
            <td>08:00 - 10:00</td><!-- Horário-->
            <td>14:00 - 16:00</td>
        </tr>
        <tr>
            <td>Terça</td>
            <td>10:00 - 12:00</td>
            <td>16:00 - 18:00</td>
        </tr>
        <tr><!-- Terceira Linha-->
            <td>Quarta</td>
            <td>14:00 - 16:00</td>
            <td>16:00 - 18:00</td>
        </tr>
    </tbody>
        </table>
    </center>
</body>
</html>
